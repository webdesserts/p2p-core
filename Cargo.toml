[package]
name = "p2p-core"
version = "0.1.6"
edition = "2024"
authors = ["Michael Mullins"]
license = "Apache-2.0"
repository = "https://github.com/webdesserts/p2p-core"
description = "iroh-based peer-to-peer networking: identity, pairing, mDNS discovery, relay and gossip"

[features]
# Test-only surface: exposes constructors that simulate constrained network
# conditions (relay-only endpoints with no IP transports) so downstream
# integration-test crates can reproduce off-LAN/NAT topologies. Never enabled
# in production builds. `#[cfg(test)]` would not cross the crate boundary into
# sync-daemon's integration tests, so this is a feature instead.
test-util = []

[dependencies]
ed25519-dalek = { version = "2", features = ["rand_core"] }
getrandom = { version = "0.2", features = ["js"] }
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
# `mesh_from_discovery_event` (discovery) + `publish_mesh_info` (node) serialize
# `MeshMetadata` to/from JSON in production code, so `serde_json` is a hard dep.
serde_json = "1.0"
thiserror = "2"
tracing = "0.1"
anyhow = "1.0"
# `AllowedPeer`/`PairingSession` timestamps use `web_time` for a portable
# SystemTime/Instant.
web-time = "1"
# Pairing HMAC-SHA256 (the only consumer of these in the crate).
sha2 = "0.10"
hmac = "0.12"
# iroh networking. `iroh` supplies `RelayUrl` (used by the relay layer and its
# off-LAN classifier), `EndpointId` + `address_lookup` (used by the mDNS actor);
# `iroh-relay` with the `server` feature supplies the embedded relay server.
# `default` enables direct socket binding (mDNS lives on real LAN interfaces);
# p2p-core is unconditionally native.
# Versions mirror sync-daemon's declarations.
iroh = { version = "1.4.1", default-features = false, features = [
    "tls-ring",
    "default",
    "platform-verifier",
] }
iroh-relay = { version = "1.4.1", features = ["server"] }
# iroh-gossip — HyParView membership + PlumTree broadcast. The node registers the
# gossip ALPN + handler and exposes `join_topic`; `GOSSIP_ALPN`/`Gossip`/`TopicId`
# come from here.
iroh-gossip = { version = "0.102.0", default-features = false, features = ["net"] }
# mDNS mesh discovery actor (native-only, the `obsidian-sync` service).
mdns-sd = "0.20"
# BASE32 encoding of the mDNS instance name + relay-url decode.
data-encoding = "2"
# `ReceiverStream` adapter bridging the actor channel to a discovery stream.
tokio-stream = "0.1"
# Cross-platform async task spawning + boxed streams used by the mDNS actor.
n0-future = "0.3"
# `FutureExt::flatten_stream` in the mDNS `AddressLookup::resolve` impl.
futures = "0.3"
# The pairing QUIC handler serializes its wire messages with bincode in
# production code, and the pairing round-trip tests assert byte-stability.
bincode = "1.3"
# `bytes::Bytes` is iroh-gossip's payload type; the gossip transport's
# `broadcast(Bytes)` / `GossipEvent::Data { bytes }` speak it directly.
bytes = "1"
# The workspace `tokio` is `features = ["full"]`, which already includes `fs`
# (used by `FileKeyStorage`), `rt`, `macros`, and `time` (mDNS requery timers).
# No per-crate feature subset needed.
tokio = { version = "1", features = ["full"] }
# `DaemonConfig` serde-serializes to/from `.sync/daemon.toml`.
toml = "0.8"
# `DaemonLock`'s flock-based single-instance guard on `.sync/daemon.lock`.
fs2 = "0.4"

[dev-dependencies]
# `rt-multi-thread` + `time` are for the relocated `relay_probe` example's bare
# `#[tokio::main]` + `tokio::spawn` + `tokio::time` (its previous home had a
# wider dev graph; p2p-core's narrower graph needs them explicit).
tokio = { version = "1", features = ["full"] }
tempfile = "3"
# `relay_probe` surfaces iroh's relay-client logs via `RUST_LOG` (EnvFilter).
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Diagnostic: probe whether two relay-only iroh nodes can connect through a given
# relay. Uses raw `iroh::*` (p2p-core owns iroh), so no `required-features`.
[[example]]
name = "relay_probe"
